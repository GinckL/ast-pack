[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ast-pack"
version = "0.1.0"
description = "Surgical LLM context from a Tree-sitter call graph: give a function, file:line or stack trace, get only the code slice that matters (callers, callees, types, constants) as a dense, syntactically valid prompt."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Azimxon Vaxobov (Ginckl)" }]
maintainers = [{ name = "Azimxon Vaxobov (Ginckl)" }]
keywords = [
  "llm-context",
  "context-packing",
  "code-context",
  "prompt-engineering",
  "token-reduction",
  "token-optimization",
  "context-window",
  "tree-sitter",
  "abstract-syntax-tree",
  "ast",
  "call-graph",
  "dependency-graph",
  "symbol-graph",
  "code-slicing",
  "program-slicing",
  "repomix-alternative",
  "repo-to-prompt",
  "codebase-to-prompt",
  "stack-trace",
  "debugging",
  "rag",
  "code-search",
  "mcp",
  "model-context-protocol",
  "ai-coding-agent",
  "claude",
  "chatgpt",
  "cursor",
  "python",
  "typescript",
  "javascript",
  "rust",
  "go",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "tree-sitter>=0.24,<0.27",  # 0.26.0 segfaults on some real-world files (e.g. flask/app.py)
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-rust>=0.23",
  "tree-sitter-go>=0.23",
  "pathspec>=0.12",
  "tiktoken>=0.7",
  "starlette>=0.37",
  "uvicorn>=0.29",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4"]

[project.scripts]
ast-pack = "ast_pack.cli:main"

[project.urls]
Homepage = "https://github.com/ginckl/ast-pack"
Documentation = "https://github.com/ginckl/ast-pack#readme"
Repository = "https://github.com/ginckl/ast-pack"
Issues = "https://github.com/ginckl/ast-pack/issues"
"LLM Docs" = "https://github.com/ginckl/ast-pack/blob/main/llms-full.txt"
Changelog = "https://github.com/ginckl/ast-pack/blob/main/CHANGELOG.md"
"Author Website" = "https://azimxonvaxobov.netlify.app"
"Author LinkedIn" = "https://www.linkedin.com/in/azimxon-vaxobov/"
"Author Telegram" = "https://t.me/A_Vakhobov"

[tool.hatch.build.targets.wheel]
packages = ["src/ast_pack"]
# The web UI bundle is built into src/ast_pack/web (gitignored) and must still ship.
artifacts = ["src/ast_pack/web/**"]

[tool.hatch.build.targets.sdist]
include = ["src/ast_pack", "tests", "README.md", "LICENSE", "llms.txt", "llms-full.txt", "schema.json", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 130
target-version = "py310"

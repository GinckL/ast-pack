name: Release

# Push a tag like v0.1.0 to build, test and publish to PyPI via trusted
# publishing (configure the "pypi" environment and a trusted publisher for
# this workflow on pypi.org first).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version matches tag
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "pyproject version $version != tag ${GITHUB_REF_NAME}"; exit 1; }
      - run: python -m pip install build
      - run: python -m build
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/ast-pack --version
          /tmp/v/bin/ast-pack -C tests/fixtures/polyglot process_payment -d 1 --json --no-bundle
          /tmp/v/bin/python -c "import ast_pack.server as s; assert s.ui_dist_dir(), 'web UI missing from wheel'"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "ast-pack ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
